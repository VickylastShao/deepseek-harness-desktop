name: Build installers and runtime channel

on:
  workflow_dispatch:
    inputs:
      signing_validation:
        description: Sign and verify installers without creating a GitHub Release
        required: true
        type: boolean
        default: false
      prerelease_artifact_run_id:
        description: Successful workflow run to publish as an unsigned prerelease without rebuilding
        required: false
        type: string
        default: ''
  schedule:
    - cron: '17 19 * * *'
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  signing-preflight:
    runs-on: ubuntu-24.04
    env:
      DSH_RELEASE_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true }}
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER }}
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release signing configuration
        run: node scripts/validate-release-signing.cjs

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.prerelease_artifact_run_id == ''
    needs: signing-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
            builder_args: --linux --x64
            resources_path: release/linux-unpacked/resources
          - id: win32-x64
            os: windows-2025
            builder_args: --win --x64
            resources_path: release/win-unpacked/resources
          - id: darwin-x64
            os: macos-15-intel
            builder_args: --mac --x64
            app_path: release/mac/DeepSeek Harness Desktop.app
            resources_path: release/mac/DeepSeek Harness Desktop.app/Contents/Resources
          - id: darwin-arm64
            os: macos-15
            builder_args: --mac --arm64
            app_path: release/mac-arm64/DeepSeek Harness Desktop.app
            resources_path: release/mac-arm64/DeepSeek Harness Desktop.app/Contents/Resources
    runs-on: ${{ matrix.os }}
    env:
      DSH_NPM_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      RUNTIME_CHANNEL: https://github.com/${{ github.repository }}/releases/download/runtime-channel/runtime-channel.json
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential python3
      - name: Install desktop build dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build and verify the native Harness runtime
        run: npm run prepare:seed
      - name: Verify the real Harness web server
        run: npm run smoke:harness
        env:
          DSH_RUNTIME_TEST_ROOT: build/runtime-cache/${{ matrix.id }}
      - name: Package the platform runtime update
        run: npm run package:runtime
      - name: Embed this repository's stable runtime channel
        run: node scripts/configure-runtime-channel.cjs "${{ env.RUNTIME_CHANNEL }}"
      - name: Configure desktop application updates
        if: github.event_name != 'schedule'
        run: node scripts/configure-desktop-updates.cjs "${{ startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true }}"
      - name: Build and require platform-signed installer
        if: >-
          github.event_name != 'schedule' &&
          (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          (runner.os == 'macOS' ||
          (runner.os == 'Windows' && vars.WINDOWS_SIGNING_PROVIDER == 'certificate'))
        run: npm run dist -- ${{ matrix.builder_args }} --publish never --config.forceCodeSigning=true
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      - name: Build unsigned macOS development installer
        if: >-
          github.event_name != 'schedule' &&
          !(startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          runner.os == 'macOS'
        run: npm run dist -- ${{ matrix.builder_args }} --publish never --config.mac.notarize=false --config.mac.identity=null
      - name: Build unsigned or externally signed platform installer
        if: >-
          github.event_name != 'schedule' &&
          runner.os != 'macOS' &&
          !((startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          runner.os == 'Windows' && vars.WINDOWS_SIGNING_PROVIDER == 'certificate')
        run: npm run dist -- ${{ matrix.builder_args }} --publish never
      - name: Verify the packaged runtime archive and real web server
        if: github.event_name != 'schedule'
        run: npm run verify:packaged -- "${{ matrix.resources_path }}"
      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-windows
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          runner.os == 'Windows' && vars.WINDOWS_SIGNING_PROVIDER == 'signpath'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-${{ github.run_id }}
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
      - name: Submit Windows installer to SignPath
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          runner.os == 'Windows' && vars.WINDOWS_SIGNING_PROVIDER == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows
      - name: Install the SignPath-signed Windows installer
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) &&
          runner.os == 'Windows' && vars.WINDOWS_SIGNING_PROVIDER == 'signpath'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem signed-windows -Recurse -File -Filter *.exe)
          $unsigned = @(Get-ChildItem release -File -Filter *.exe)
          if ($signed.Count -ne 1 -or $unsigned.Count -ne 1) {
            throw "Expected exactly one signed and one unsigned Windows installer."
          }
          Copy-Item -LiteralPath $signed[0].FullName -Destination $unsigned[0].FullName -Force
      - name: Verify Windows Authenticode signature
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -File -Filter *.exe)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          Write-Host "Verified Windows publisher: $($signature.SignerCertificate.Subject)"
          $installRoot = Join-Path $env:RUNNER_TEMP "deepseek-harness-signature-check"
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Silent installation failed with exit code $($process.ExitCode)."
          }
          $applications = @(Get-ChildItem $installRoot -Recurse -File -Filter 'DeepSeek Harness Desktop.exe')
          if ($applications.Count -ne 1) {
            throw "Expected exactly one installed DeepSeek Harness Desktop executable."
          }
          $applicationSignature = Get-AuthenticodeSignature -FilePath $applications[0].FullName
          if ($applicationSignature.Status -ne 'Valid') {
            throw "Installed application signature verification failed: $($applicationSignature.Status) $($applicationSignature.StatusMessage)"
          }
          Write-Host "Verified installed Windows publisher: $($applicationSignature.SignerCertificate.Subject)"
      - name: Verify macOS signature and notarization ticket
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.signing_validation == true) && runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 "${{ matrix.app_path }}"
          spctl --assess --type execute --verbose=4 "${{ matrix.app_path }}"
          xcrun stapler validate "${{ matrix.app_path }}"
      - name: Prepare desktop update metadata from final artifacts
        if: github.event_name != 'schedule'
        run: node scripts/desktop-update-metadata.cjs prepare release "${{ matrix.id }}" update-metadata
      - name: Write installer checksums
        if: github.event_name != 'schedule'
        run: node scripts/write-checksums.cjs release release/SHA256SUMS-${{ matrix.id }}.txt
      - name: Upload platform deliverables
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-${{ matrix.id }}
          if-no-files-found: error
          path: |
            runtime-release/*
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-*.txt
            update-metadata/*.yml

  publish-runtime-channel:
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install manifest merger dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-desktop-*
          path: release-input
          merge-multiple: true
      - name: Merge platform runtime manifests
        run: node scripts/merge-runtime-channel.cjs release-input/runtime-release release-input/runtime-channel.json
        env:
          RUNTIME_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/runtime-channel/
          RUNTIME_REQUIRED_KEYS: linux-x64,win32-x64,darwin-x64,darwin-arm64
      - name: Create or update stable runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view runtime-channel >/dev/null 2>&1; then
            gh release create runtime-channel --title "DeepSeek Harness Runtime Channel" --notes "Platform-native runtime bundles used by the desktop background updater."
          fi
          gh release upload runtime-channel release-input/runtime-release/*.tgz release-input/runtime-channel.json --clobber

  validate-desktop-update-metadata:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata merger dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-desktop-*
          path: release-input
          merge-multiple: true
      - name: Validate cross-platform desktop update metadata
        run: node scripts/desktop-update-metadata.cjs merge release-input/update-metadata release-input/release
      - name: Upload merged update metadata
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-metadata-${{ github.run_id }}
          if-no-files-found: error
          path: release-input/release/latest*.yml

  publish-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate-desktop-update-metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata merger dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: deepseek-harness-desktop-*
          path: release-input
          merge-multiple: true
      - name: Merge cross-platform desktop update metadata
        run: node scripts/desktop-update-metadata.cjs merge release-input/update-metadata release-input/release
      - name: Generate GitHub change log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > release-input/generated-changes.md; then
            echo "## Changes" > release-input/generated-changes.md
            echo >> release-input/generated-changes.md
            echo "See the repository commit history for this release." >> release-input/generated-changes.md
          fi
      - name: Generate direct-download release notes
        run: node scripts/generate-release-notes.cjs "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" release-input/generated-changes.md release-input/release/RELEASE_NOTES.md
      - name: Publish tagged installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-input/release/*.exe release-input/release/*.AppImage release-input/release/*.deb release-input/release/*.dmg release-input/release/*.zip release-input/release/latest*.yml release-input/release/SHA256SUMS-*.txt --notes-file release-input/release/RELEASE_NOTES.md --repo "${GITHUB_REPOSITORY}" --verify-tag

  publish-unsigned-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_artifact_run_id != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate source workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.prerelease_artifact_run_id }}
        run: |
          source_run=$(gh run view "${SOURCE_RUN_ID}" --json conclusion,event,headSha)
          source_conclusion=$(jq -r .conclusion <<<"${source_run}")
          source_event=$(jq -r .event <<<"${source_run}")
          source_sha=$(jq -r .headSha <<<"${source_run}")
          if [[ "${source_conclusion}" != success || "${source_event}" != workflow_dispatch ]]; then
            echo "Source run must be a successful workflow_dispatch build." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${source_sha}" HEAD; then
            echo "Source run commit is not an ancestor of the publishing commit." >&2
            exit 1
          fi
          echo "SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"
      - name: Install metadata merger dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prerelease_artifact_run_id }}
          pattern: deepseek-harness-desktop-*
          path: release-input
          merge-multiple: true
      - name: Merge and validate cross-platform desktop update metadata
        run: node scripts/desktop-update-metadata.cjs merge release-input/update-metadata release-input/release
      - name: Validate prerelease version and asset names
        shell: bash
        run: |
          app_version=$(node -p "require('./package.json').version")
          release_tag="v${app_version}"
          test "$(node -p "require('fs').readFileSync('release-input/release/latest.yml', 'utf8').match(/^version: (.+)$/m)[1]")" = "${app_version}"
          compgen -G "release-input/release/DeepSeek-Harness-Desktop-${app_version}-*" >/dev/null
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate GitHub change log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" -f target_commitish="${SOURCE_SHA}" \
            --jq .body > release-input/generated-changes.md; then
            echo "## Changes" > release-input/generated-changes.md
            echo >> release-input/generated-changes.md
            echo "See the repository commit history for this prerelease." >> release-input/generated-changes.md
          fi
      - name: Generate direct-download release notes
        run: node scripts/generate-release-notes.cjs "${GITHUB_REPOSITORY}" "${RELEASE_TAG}" release-input/generated-changes.md release-input/release/RELEASE_NOTES.md --unsigned-prerelease
      - name: Publish unsigned prerelease installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_TAG}" release-input/release/*.exe release-input/release/*.AppImage release-input/release/*.deb release-input/release/*.dmg release-input/release/*.zip release-input/release/latest*.yml release-input/release/SHA256SUMS-*.txt --notes-file release-input/release/RELEASE_NOTES.md --repo "${GITHUB_REPOSITORY}" --target "${SOURCE_SHA}" --prerelease

name: Verify source changes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            os: ubuntu-24.04
          - id: windows
            os: windows-2025
          - id: macos
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Require all source checks
        env:
          UNIT_TEST_RESULT: ${{ needs.unit-tests.result }}
        run: test "$UNIT_TEST_RESULT" = success

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="desktop-center.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">DS</div>
        <div><h1 data-i18n="title">Desktop Control Center</h1><p data-i18n="subtitle">Runtime, updates, and local desktop preferences</p></div>
      </header>
      <section class="status-grid" aria-live="polite">
        <article class="card">
          <div class="card-heading"><span data-i18n="desktop">Desktop shell</span><span id="desktop-badge" class="badge"></span></div>
          <strong id="desktop-version">—</strong><p id="desktop-status">—</p>
          <button id="check-desktop" type="button" data-i18n="checkDesktop">Check desktop update</button>
        </article>
        <article class="card">
          <div class="card-heading"><span>DeepSeek Harness</span><span id="harness-badge" class="badge"></span></div>
          <strong id="harness-version">—</strong><p id="harness-status">—</p>
          <div class="actions"><button id="check-harness" type="button" data-i18n="checkHarness">Check Harness update</button><button id="restart-harness" class="secondary" type="button" data-i18n="restart">Restart</button></div>
        </article>
      </section>
      <section class="card section-card">
        <h2 data-i18n="preferences">Preferences</h2>
        <label><span data-i18n="closeToTray">Keep running when the window closes</span><input id="close-to-tray" type="checkbox"></label>
        <label><span data-i18n="notifications">Desktop notifications</span><input id="notifications" type="checkbox"></label>
        <label id="open-at-login-row"><span data-i18n="openAtLogin">Start at login</span><input id="open-at-login" type="checkbox"></label>
      </section>
      <section class="card section-card">
        <h2 data-i18n="localData">Local data</h2>
        <div class="path-row"><div><span data-i18n="dataDirectory">Application data</span><code id="data-path"></code></div><button id="open-data" class="secondary" type="button" data-i18n="open">Open</button></div>
        <div class="path-row"><div><span data-i18n="logDirectory">Desktop logs</span><code id="log-path"></code></div><button id="open-logs" class="secondary" type="button" data-i18n="open">Open</button></div>
      </section>
      <p id="error" role="alert" hidden></p>
    </main>
    <script src="desktop-center.js"></script>
  </body>
</html>

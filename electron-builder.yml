appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness Desktop
asar: true
npmRebuild: false
directories:
  output: release
electronUpdaterCompatibility: '>=2.16'
publish:
  provider: github
  owner: VickylastShao
  repo: deepseek-harness-desktop
files:
  - src/**/*
  - assets/**/*
  - package.json
  - '!node_modules/node/**/*'
extraResources:
  - from: node_modules/node
    to: node-runtime
  - from: .
    to: .
    filter:
      - 'runtime-seed/**/*'
artifactName: DeepSeek-Harness-Desktop-${version}-${os}-${arch}.${ext}
win:
  icon: assets/app-icon.svg
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  icon: assets/app-icon.svg
  executableName: deepseek-harness-desktop
  category: Development
  maintainer: VickylastShao <22924324+VickylastShao@users.noreply.github.com>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
mac:
  icon: assets/app-icon.svg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - target: dmg
    - target: zip
